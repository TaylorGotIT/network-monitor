name: Docker

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Image tag, e.g. 2.5.8"
        required: false
        default: "2.5.8"
  push:
    tags:
      - "v*"

permissions:
  contents: read
  packages: write

jobs:
  smoke:
    name: Smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Build image
        run: docker build -t network-monitor:smoke .

      - name: Run and verify probes
        run: |
          docker run -d --name monitor-smoke -p 18888:8888 network-monitor:smoke
          for i in $(seq 1 30); do
            if curl -fsS http://127.0.0.1:18888/login >/dev/null 2>&1; then break; fi
            sleep 2
          done
          echo "--- login page ---"
          curl -fsS http://127.0.0.1:18888/login >/dev/null
          echo "--- ping ---"
          docker exec monitor-smoke ping -c 1 -W 2 127.0.0.1
          echo "--- traceroute ---"
          docker exec monitor-smoke traceroute -n -m 3 -w 2 127.0.0.1
          echo "--- mtr ---"
          docker exec monitor-smoke mtr -n -c 1 -r 127.0.0.1
          echo "--- container log ---"
          docker logs monitor-smoke

      - name: Cleanup
        if: always()
        run: docker rm -f monitor-smoke || true

  build:
    name: Build and push
    needs: smoke
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.repository_owner }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/taylorgotit/network-monitor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=${{ github.event.inputs.version }},enable=${{ github.event.inputs.version != '' }}
            type=sha,format=short
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
